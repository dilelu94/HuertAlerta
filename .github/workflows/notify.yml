name: Notificador de Semillas de Viernes

on:
  schedule:
    # Ejecutar todos los viernes a las 12:00 UTC (9:00 AM Argentina)
    - cron: '0 12 * * 5'
  workflow_dispatch: # Permite ejecutar manualmente desde GitHub

jobs:
  notify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar Notificador
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python notifier.py

      - name: Evitar suspensión por inactividad
        run: |
          LAST_COMMIT_TS=$(git log -1 --format=%ct)
          CURRENT_TS=$(date +%s)
          DIFF_DAYS=$(( (CURRENT_TS - LAST_COMMIT_TS) / 86400 ))
          if [ $DIFF_DAYS -gt 50 ]; then
            git config --global user.name 'github-actions[bot]'
            git config --global user.email 'github-actions[bot]@users.noreply.github.com'
            git commit --allow-empty -m "Auto keepalive commit to prevent cron suspension"
            git push
          else
            echo "El último commit fue hace $DIFF_DAYS días. No es necesario el keepalive todavía."
          fi
